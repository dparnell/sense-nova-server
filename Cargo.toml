[package]
name = "sensenova-loop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
half = "2.7.1"
indicatif = "0.18.6"
memmap2 = "0.9.12"
minijinja = { version = "3.0.5", features = ["json", "builtins", "serde", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat"] }
nvml-wrapper = "0.13.0"
pollster = "1.0.1"
rand = "0.10.3"
ratatui = "0.30.2"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = "0.40.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["cors"] }
wgpu = "30.0.1"
